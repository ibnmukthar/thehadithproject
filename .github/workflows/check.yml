name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  data:
    name: Validate the record
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Schema and integrity
        run: pnpm check:data
      - name: Sign-off on changes to the record
        if: github.event_name == 'pull_request'
        run: pnpm tsx scripts/check-signoff.ts origin/${{ github.base_ref }}
      - name: Lint
        run: pnpm lint
      - name: Build
        env:
          NODE_ENV: production
        run: pnpm build
